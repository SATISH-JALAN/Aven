packages:
  - "backend/*"
  - "frontend"
# esbuild (used by tsx and vitest) runs an install script that checks its platform binary.
allowBuilds:
  esbuild: true
  # Optional native speed-ups / telemetry pulled in by Privy (frontend); all have JS fallbacks. Reviewed: deny.
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false
