<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="t d"><title id="t">Aven replay on real Hyperliquid history</title><desc id="d">Pipeline from the Hyperliquid mainnet info API through a Foundry replay of four pools to the web export, and the result: LP value minus HODL per pool for the Oct 29 2026 Binance halt and a calm day.</desc><defs><marker id="m6e7681" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6e7681"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/></filter></defs><style>.flow{stroke-dasharray:7 6;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="0.5" y="0.5" width="1279" height="689" rx="20" fill="#0d1117" stroke="#30363d"/><text x="48" y="60" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#e6edf3" text-anchor="start">Aven · replay on real Hyperliquid history</text><text x="48" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Same HYPE price path, same seeded retail flow, four pools. Spec-default parameters, nothing tuned.</text><rect x="48" y="128" width="214" height="112" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="58" y="141" width="3.5" height="86" rx="1.75" fill="#fbbf24" stroke="none" stroke-width="1.0"/><text x="72" y="155" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Hyperliquid info API</text><text x="72" y="176" font-family="Inter, -apple-system, 'Segoe U