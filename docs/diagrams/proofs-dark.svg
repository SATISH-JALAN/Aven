<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">How every Aven fee is proven</title><desc id="d">Three checks: Solidity and TypeScript agree on 10,000 fee vectors and 2,000 anchor vectors; every live FeeComputed event is recomputed and cross-checked against the PoolManager Swap fee; and the Foundry suite covers unit, fuzz, integration, invariant and load tests.</desc><defs><marker id="m2dd4bf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#2dd4bf"/></marker><marker id="m6e7681" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6e7681"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/></filter></defs><style>.flow{stroke-dasharray:7 6;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="0.5" y="0.5" width="1279" height="719" rx="20" fill="#0d1117" stroke="#30363d"/><text x="48" y="60" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#e6edf3" text-anchor="start">Aven · how every fee is proven</text><text x="48" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Three independent checks. The fee math and the hook rules were also mutation-tested: we broke the code on purpose and watched the matching test go red.</text><rect x="48" y="124" width="1184" height="168" rx="18" fill="#10151c" stroke="#30363d" stroke-width="1.2"/><text x="72" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#8b949e" text-anchor="start" letter-spacing="1.4">SAME MATH, TWO LANGUAGES</text><rect x="889.25" y="136" width="318.75" height="28" rx="14.0" fill="#0e2215" stroke="#4ade80" stroke-width="1.0"/><text x="1048.625" y="154.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#86efac" text-anchor="middle">I7 · 10,000 / 10,000 + 2,000 / 2,000 exact</text><rect x="72" y="176" width="250" height="92" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="82" y="189" width="3.5" height="66" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="96" y="203" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">AvenFairValue.compute</text><text x="96" y="224" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Solidity · FullMath.mulDiv</text><text x="96" y="243" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">contracts/src</text><rect x="370" y="176" width="270" height="92" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="380" y="189" width="3.5" height="66" rx="1.75" fill="#8b949e" stroke="none" stroke-width="1.0"/><text x="394" y="203" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">GenVectors.t.sol</text><text x="394" y="224" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">fixed seed · 9 coverage classes</text><text x="394" y="243" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">GEN_VECTORS=1</text><rect x="688" y="176" width="240" height="92" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="698" y="189" width="3.5" height="66" rx="1.75" fill="#8b949e" stroke="none" stroke-width="1.0"/><text x="712" y="203" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Vectors (JSON)</text><text x="712" y="224" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">10,000 fee · 2,000 anchor</text><text x="712" y="243" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">backend/data/vectors</text><rect x="976" y="176" width="232" height="92" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="986" y="189" width="3.5" height="66" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="1000" y="203" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">fee.ts (BigInt)</text><text x="1000" y="224" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">differential.test.ts</text><text x="1000" y="243" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">every Breakdown field</text><path d="M322 222 L366 222" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6e7681)"/><path d="M640 222 L684 222" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6e7681)"/><path d="M928 222 L972 222" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6e7681)"/><rect x="48" y="312" width="1184" height="210" rx="18" fill="#10151c" stroke="#30363d" stroke-width="1.2"/><text x="72" y="342" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#8b949e" text-anchor="start" letter-spacing="1.4">EVERY LIVE FEE, RE-DERIVED</text><rect x="827.375" y="324" width="380.625" height="28" rx="14.0" fill="#0e2215" stroke="#4ade80" stroke-width="1.0"/><text x="1017.6875" y="342.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#86efac" text-anchor="middle">I8 · local 2/2 · burst 280/280 · RPC faults 348/348</text><rect x="72" y="370" width="190" height="128" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="82" y="383" width="3.5" height="102" rx="1.75" fill="#ff4fa3" stroke="none" stroke-width="1.0"/><text x="96" y="397" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Swap tx</text><text x="96" y="418" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">any router · any wallet</text><text x="96" y="437" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Arena bot or shock</text><rect x="306" y="364" width="272" height="62" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="316" y="377" width="3.5" height="36" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="330" y="389" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">FeeComputed</text><text x="330" y="408" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">every input the fee used</text><rect x="306" y="442" width="272" height="62" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="316" y="455" width="3.5" height="36" rx="1.75" fill="#ff4fa3" stroke="none" stroke-width="1.0"/><text x="330" y="467" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">PoolManager Swap</text><text x="330" y="486" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">the fee actually charged</text><rect x="622" y="364" width="268" height="140" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="632" y="377" width="3.5" height="114" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="646" y="391" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">pnpm verify &lt;tx&gt;</text><text x="646" y="412" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">rebuild Inputs from the event</text><text x="646" y="431" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">recompute with fee.ts</text><text x="646" y="450" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">--all: ≤ 50-block log chunks</text><text x="646" y="469" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">also: GET /verify/:tx</text><path d="M262 420 C 284 420, 284 395, 302 395" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6e7681)"/><path d="M262 448 C 284 448, 284 473, 302 473" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6e7681)"/><path d="M578 395 C 600 395, 600 420, 618 420" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m2dd4bf)"/><path d="M578 473 C 600 473, 600 448, 618 448" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m2dd4bf)"/><rect x="936" y="372" width="272" height="32" rx="16.0" fill="#1c2330" stroke="#3d444d" stroke-width="1.0"/><text x="1072.0" y="392.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e6edf3" text-anchor="middle">check A · recomputed == event fee</text><rect x="936" y="414" width="272" height="32" rx="16.0" fill="#1c2330" stroke="#3d444d" stroke-width="1.0"/><text x="1072.0" y="434.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e6edf3" text-anchor="middle">check B · Swap.fee == event fee</text><rect x="936" y="458" width="272" height="36" rx="18.0" fill="#0e2215" stroke="#4ade80" stroke-width="1.0"/><text x="1072.0" y="481.4" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#86efac" text-anchor="middle">MATCH</text><path d="M890 434 L930 434" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6e7681)"/><rect x="48" y="542" width="1184" height="158" rx="18" fill="#10151c" stroke="#30363d" stroke-width="1.2"/><text x="72" y="572" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#8b949e" text-anchor="start" letter-spacing="1.4">CONTRACT TEST SUITE · forge test</text><rect x="1040.5" y="554" width="167.5" height="28" rx="14.0" fill="#0e2215" stroke="#4ade80" stroke-width="1.0"/><text x="1124.25" y="572.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#86efac" text-anchor="middle">90 passed · 0 failed</text><rect x="72" y="592" width="214" height="88" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="82" y="605" width="3.5" height="62" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="96" y="619" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Unit + fuzz</text><text x="96" y="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">34 tests · 1,000 runs</text><text x="96" y="659" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">fixed seed</text><rect x="302" y="592" width="214" height="88" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="312" y="605" width="3.5" height="62" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="326" y="619" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">v4 integration</text><text x="326" y="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">real PoolManager</text><text x="326" y="659" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">both token orders</text><rect x="532" y="592" width="214" height="88" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="542" y="605" width="3.5" height="62" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="556" y="619" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">9 named tests</text><text x="556" y="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">split swap · dust · sandwich</text><text x="556" y="659" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">bad reads · wrong pool</text><rect x="762" y="592" width="214" height="88" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="772" y="605" width="3.5" height="62" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="786" y="619" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Invariants</text><text x="786" y="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">I1 I2 I3 I4 I9</text><text x="786" y="659" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">64 runs × 64 calls</text><rect x="992" y="592" width="214" height="88" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.0" filter="url(#shadow)"/><rect x="1002" y="605" width="3.5" height="62" rx="1.75" fill="#2dd4bf" stroke="none" stroke-width="1.0"/><text x="1016" y="619" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Load · LOAD=1</text><text x="1016" y="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">2,318 swaps / 250 blocks</text><text x="1016" y="659" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">broken reads · 0 reverts</text></svg>
